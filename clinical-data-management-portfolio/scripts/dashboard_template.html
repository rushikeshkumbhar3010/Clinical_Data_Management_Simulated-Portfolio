<title>Clinical Data Management Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: report canvas with a left page-navigator rail (top tab strip on phones), slicer bar above the visuals.
   Palette: cool slate canvas, white report cards, blue/orange/aqua/yellow/violet series from the validated default order.
   Type: IBM Plex Sans for UI, IBM Plex Mono for IDs and figures. */
:root{
  --bg:#eaeef2; --surface:#ffffff; --ink:#14202b; --ink2:#475766; --muted:#788794; --line:#dbe2e8; --soft:#f3f6f8;
  --nav:#1a2530; --nav-ink:#c9d3dc; --nav-on:#ffffff; --tab:#f2c811;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#6250d6;
  --good:#0b7a4b; --bad:#c2371f;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e151c; --surface:#17212b; --ink:#e8eef3; --ink2:#b3bfca; --muted:#8392a0; --line:#2a3744; --soft:#1d2935;
  --nav:#0a1015; --nav-ink:#9fb0bf; --nav-on:#fff;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9; --good:#3cc58c; --bad:#ef7a66; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e151c; --surface:#17212b; --ink:#e8eef3; --ink2:#b3bfca; --muted:#8392a0; --line:#2a3744; --soft:#1d2935;
  --nav:#0a1015; --nav-ink:#9fb0bf; --nav-on:#fff;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9; --good:#3cc58c; --bad:#ef7a66; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.4;margin:0}
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
.rail{background:var(--nav);color:var(--nav-ink);padding:18px 0;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;align-self:start;height:100vh}
.brand{padding:0 18px 16px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:8px}
.brand b{display:block;color:var(--nav-on);font-size:15px;font-weight:600;letter-spacing:.01em}
.brand span{font-size:11.5px;color:var(--nav-ink)}
.tab{appearance:none;border:0;background:none;color:inherit;font:inherit;text-align:left;padding:10px 18px;cursor:pointer;display:flex;gap:10px;align-items:center;border-left:3px solid transparent}
.tab:hover{background:rgba(255,255,255,.05);color:var(--nav-on)}
.tab[aria-current="page"]{color:var(--nav-on);background:rgba(255,255,255,.08);border-left-color:var(--tab);font-weight:500}
.tab:focus-visible,.btn:focus-visible,select:focus-visible{outline:2px solid var(--tab);outline-offset:-2px}
.tab svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6}
.rail .foot{margin-top:auto;padding:14px 18px 0;font-size:11.5px;border-top:1px solid rgba(255,255,255,.08)}
.main{min-width:0;padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:end;justify-content:space-between;margin-bottom:14px}
.bar h1{font-size:20px;font-weight:600;margin:0;text-wrap:balance}
.bar p{margin:2px 0 0;color:var(--ink2);font-size:12.5px}
.slicers{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.slicers label{display:flex;flex-direction:column;gap:3px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
select,.btn{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:7px 10px;min-height:34px}
.btn{cursor:pointer}.btn:hover{border-color:var(--s1)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;min-width:0}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .v{font-family:var(--f-num);font-size:26px;font-weight:500;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink2);margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px 12px;min-width:0;grid-column:span 6}
.card.w4{grid-column:span 4}.card.w8{grid-column:span 8}.card.w12{grid-column:span 12}
.card h3{font-size:13.5px;font-weight:600;margin:0}
.card .sub{font-size:12px;color:var(--muted);margin:2px 0 8px}
.plot{width:100%;min-width:0}
svg{display:block;max-width:100%;overflow:visible}
.lbl{font:12px var(--f-ui);fill:var(--ink2)}.val{font:12px var(--f-num);fill:var(--ink)}.ax{font:11px var(--f-num);fill:var(--muted)}
.grid-l{stroke:var(--line);stroke-width:1}
.clk{cursor:pointer}.clk:hover rect:nth-of-type(2){opacity:.8}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 0;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.donut{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.donut ul{list-style:none;margin:0;padding:0;display:grid;gap:5px;flex:1;min-width:150px;font-size:12.5px}
.donut li{display:flex;justify-content:space-between;gap:10px;color:var(--ink2)}
.donut li i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px}
.donut li b{font-family:var(--f-num);font-weight:500;color:var(--ink)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
td.id{font-family:var(--f-num)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;border:1px solid currentColor;line-height:18px}
.bt{display:flex;align-items:center;gap:8px;min-width:120px}.bt span{flex:none;width:44px;text-align:right;font-family:var(--f-num)}
.bt div{height:8px;border-radius:2px;background:var(--s1)}
.heat td{text-align:center;font-family:var(--f-num);padding:6px 4px;border:2px solid var(--surface);min-width:34px;color:var(--ink)}
.heat th{text-align:center;padding:6px 4px}.heat td.rowh{text-align:left;font-family:var(--f-ui);background:none;white-space:nowrap}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--nav);color:#fff;font-size:12px;padding:6px 9px;border-radius:4px;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.note{margin-top:14px;color:var(--muted);font-size:12px}
@media (max-width:1000px){.card,.card.w4,.card.w8{grid-column:span 12}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;padding:0;overflow-x:auto;gap:0;align-items:stretch}
  .brand,.rail .foot{display:none}
  .tab{border-left:0;border-bottom:3px solid transparent;white-space:nowrap;padding:12px 14px}
  .tab[aria-current="page"]{border-bottom-color:var(--tab)}
  .kpi .v{font-size:22px}
}
@media (prefers-reduced-motion:no-preference){.card,.kpi{transition:border-color .15s}.card:hover,.kpi:hover{border-color:var(--s1)}}
</style>

<div class="app">
  <nav class="rail" aria-label="Report pages">
    <div class="brand"><b>Clinical Data Management</b><span>Protocol NSCLC-P2-001 · N = 350</span></div>
    <button class="tab" data-p="overview"><svg viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="5" height="5"/><rect x="9.5" y="1.5" width="5" height="5"/><rect x="1.5" y="9.5" width="5" height="5"/><rect x="9.5" y="9.5" width="5" height="5"/></svg>Study overview</button>
    <button class="tab" data-p="queries"><svg viewBox="0 0 16 16"><path d="M2 3h12v8H7l-3 3v-3H2z"/></svg>Query management</button>
    <button class="tab" data-p="safety"><svg viewBox="0 0 16 16"><path d="M8 1.5l6 2.5v4c0 3-2.5 5.5-6 6.5C4.5 13.500 2 11 2 8V4z"/></svg>Safety (AEs)</button>
    <button class="tab" data-p="quality"><svg viewBox="0 0 16 16"><path d="M2 14V8m4 6V3m4 11V6m4 8V1"/></svg>Site data quality</button>
    <div class="foot">Simulated data · cut 31-Aug-2026<br>Prepared by R. Kumbhar (CDA)</div>
  </nav>
  <main class="main">
    <div class="bar">
      <div><h1 id="ttl"></h1><p id="sub"></p></div>
      <div class="slicers">
        <label>Site<select id="site"></select></label>
        <button class="btn" id="reset" type="button">Reset</button>
        <button class="btn" id="theme" type="button">Theme</button>
      </div>
    </div>
    <div id="view"></div>
    <p class="note">Click a site bar to filter every visual. All figures are simulated for portfolio use; the same measures are defined in PowerBI/DAX_Measures.dax.</p>
  </main>
</div>
<div id="tip" hidden></div>

<script>
const D=/*DATA*/null;
const $=s=>document.querySelector(s);
const PAGES={overview:["Study overview","Enrolment, query workload and safety at a glance"],queries:["Query management","Lifecycle, ageing and turnaround against SLA"],safety:["Safety (adverse events)","Events by term, severity, seriousness and site"],quality:["Site data quality","Discrepancy load per site and per edit check"]};
const ST=[["Closed","var(--s1)"],["Open","var(--s2)"],["Answered","var(--s3)"],["Re-issued","var(--s4)"]];
const CHK={CK_DM_01:"Age out of range",CK_DM_02:"Race missing",CK_VS_01:"SBP ≤ DBP",CK_VS_02:"Pulse out of range",CK_VS_03:"Day 28 vitals missing",CK_VS_04:"Vitals before consent",CK_VS_05:"Temperature implausible",CK_LB_01:"Hemoglobin implausible",CK_AE_01:"AE stop before start",CK_AE_02:"SAE form missing",CK_AE_03:"AE before consent",CK_AE_04:"AE outcome / end missing",CK_AE_05:"Duplicate AE"};
const state={site:"ALL",page:"overview"};
const CUT=Date.UTC(2026,7,31), DAY=864e5;
const t=s=>{const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)};
const F=a=>state.site==="ALL"?a:a.filter(x=>x.s===state.site);
const pct=x=>isFinite(x)?(x*100).toFixed(1)+"%":"–";
const cnt=(a,f)=>{const o={};a.forEach(x=>{const k=f(x);o[k]=(o[k]||0)+1});return o};
const sorted=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]);
const trunc=(s,n)=>s.length>n?s.slice(0,Math.max(3,n-1))+"…":s;
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const siteName=id=>(D.sites.find(s=>s.id===id)||{name:id}).name;
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const mlab=m=>MON[+m.slice(5)-1]+" "+m.slice(2,4);

function data(){
  const subj=F(D.subj), q=F(D.q), ae=F(D.ae);
  const answered=q.filter(x=>x.tat!=null), met=answered.filter(x=>x.tat<=x.sla).length;
  const age=x=>Math.round((CUT-t(x.i))/DAY);
  return {subj,q,ae,answered,met,age,
    closed:q.filter(x=>x.st==="Closed").length, backlog:q.filter(x=>x.st!=="Closed"),
    sae:ae.filter(x=>x.ser==="Yes").length};
}
/* ---------- chart primitives (SVG, themed through CSS variables) ---------- */
function nice(max){const p=Math.pow(10,Math.floor(Math.log10(max||1))),n=max/p;const s=n<=1?1:n<=2?2:n<=5?5:10;return s*p}
function hbar(el,items,o={}){
  const w=el.clientWidth||360,lab=o.lab||(w<440?100:o.wide?230:150),rh=26,h=items.length*rh+4,max=Math.max(1,...items.map(i=>i.v)),bw=Math.max(40,w-lab-46);
  let s=`<svg width="${w}" height="${h}" role="img" aria-label="${esc(o.aria||"Bar chart")}">`;
  items.forEach((it,i)=>{const y=i*rh+2,l=Math.max(2,it.v/max*bw);
    s+=`<g class="${o.click?"clk":""}" data-tip="${esc(it.tip||it.k+": "+it.v)}"${o.click?` data-k="${it.id}"`:""}><rect x="0" y="${y}" width="${w}" height="${rh}" fill="transparent"/>
    <text class="lbl" x="0" y="${y+rh/2+4}" style="${it.id&&it.id===state.site?"font-weight:600;fill:var(--ink)":""}">${esc(trunc(it.k,lab/6.4))}</text>
    <rect x="${lab}" y="${y+5}" width="${l}" height="${rh-10}" rx="2" style="fill:${it.c||"var(--s1)"}"/><text class="val" x="${lab+l+6}" y="${y+rh/2+4}">${it.v}</text></g>`});
  el.innerHTML=s+"</svg>";
}
function vbar(el,cats,keys,o={}){
  const w=el.clientWidth||360,h=o.h||200,L=30,B=24,T=8,R=4,pw=w-L-R,ph=h-B-T;
  const tot=cats.map(c=>c.vals.reduce((a,b)=>a+b,0)),mx=nice(Math.max(1,...tot)*1.02),step=mx/4;
  let s=`<svg width="${w}" height="${h}" role="img" aria-label="${esc(o.aria||"Column chart")}">`;
  for(let i=0;i<=4;i++){const y=T+ph-i*ph/4;s+=`<line class="grid-l" x1="${L}" x2="${w-R}" y1="${y}" y2="${y}"/><text class="ax" x="${L-6}" y="${y+4}" text-anchor="end">${+(i*step).toFixed(1)}</text>`}
  const bw=Math.min(46,pw/cats.length*.62),every=Math.ceil(cats.length*34/pw*(o.lw||1.6));
  cats.forEach((c,i)=>{const cx=L+pw/cats.length*(i+.5);let y=T+ph;
    const tip=`${esc(c.k)}`+keys.map((k,j)=>`<br>${esc(k.n)}: ${c.vals[j]}`).join("");
    s+=`<g class="${o.click?"clk":""}" data-tip="${tip}"${o.click?` data-k="${c.id}"`:""}><rect x="${cx-pw/cats.length/2}" y="${T}" width="${pw/cats.length}" height="${ph}" fill="transparent"/>`;
    c.vals.forEach((v,j)=>{const hh=v/mx*ph;if(v>0){y-=hh;s+=`<rect x="${cx-bw/2}" y="${y+(keys.length>1?1:0)}" width="${bw}" height="${Math.max(1,hh-(keys.length>1?2:0))}" rx="${keys.length>1?1:2}" style="fill:${keys[j].c}"/>`}});
    s+="</g>";
    if(i%every===0)s+=`<text class="ax" x="${cx}" y="${h-7}" text-anchor="middle">${esc(c.k)}</text>`});
  el.innerHTML=s+"</svg>";
}
function line(el,labels,series,o={}){
  const w=el.clientWidth||360,h=210,L=30,B=24,T=10,R=12,pw=w-L-R,ph=h-B-T;
  const mx=nice(Math.max(1,...series.flatMap(s=>s.v))*1.05),n=labels.length,X=i=>L+pw*i/Math.max(1,n-1),Y=v=>T+ph-v/mx*ph;
  let s=`<svg width="${w}" height="${h}" role="img" aria-label="${esc(o.aria||"Line chart")}">`;
  for(let i=0;i<=4;i++){const y=T+ph-i*ph/4;s+=`<line class="grid-l" x1="${L}" x2="${w-R}" y1="${y}" y2="${y}"/><text class="ax" x="${L-6}" y="${y+4}" text-anchor="end">${+(i*mx/4).toFixed(1)}</text>`}
  const every=Math.ceil(n*64/pw);labels.forEach((l,i)=>{if(i%every===0)s+=`<text class="ax" x="${X(i)}" y="${h-7}" text-anchor="middle">${l}</text>`});
  series.forEach(se=>{s+=`<polyline fill="none" stroke-width="2" stroke-linejoin="round" style="stroke:${se.c}" points="${se.v.map((v,i)=>X(i)+","+Y(v)).join(" ")}"/>`;
    const i=n-1;s+=`<circle cx="${X(i)}" cy="${Y(se.v[i])}" r="4" style="fill:${se.c};stroke:var(--surface);stroke-width:2"/>`});
  labels.forEach((l,i)=>{s+=`<rect x="${X(i)-pw/n/2}" y="${T}" width="${pw/n}" height="${ph}" fill="transparent" data-tip="Week of ${l}${series.map(se=>`<br>${se.n}: ${se.v[i]}`).join("")}"/>`});
  el.innerHTML=s+"</svg>";
}
function donut(el,items,center){
  const tot=items.reduce((a,b)=>a+b.v,0),r=52,C=2*Math.PI*r;let off=0,arcs="";
  items.forEach(it=>{const len=tot?it.v/tot*C:0;arcs+=`<circle cx="70" cy="70" r="${r}" fill="none" stroke-width="22" stroke-dasharray="${Math.max(0,len-2)} ${C-Math.max(0,len-2)}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)" style="stroke:${it.c}" data-tip="${esc(it.k)}: ${it.v} (${pct(it.v/tot)})"/>`;off+=len});
  el.innerHTML=`<div class="donut"><svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="Share by category">${arcs}<text x="70" y="68" text-anchor="middle" style="font:500 22px var(--f-num);fill:var(--ink)">${tot}</text><text x="70" y="86" text-anchor="middle" class="ax">${center}</text></svg>
  <ul>${items.map(it=>`<li><span><i style="background:${it.c}"></i>${esc(it.k)}</span><b>${it.v} · ${pct(it.v/tot)}</b></li>`).join("")}</ul></div>`;
}
const legend=k=>`<div class="legend">${k.map(x=>`<span><i style="background:${x.c}"></i>${x.n}</span>`).join("")}</div>`;
const card=(id,title,sub,cls="")=>`<section class="card ${cls}"><h3>${title}</h3><p class="sub">${sub}</p><div class="plot" id="${id}"></div></section>`;
const kpi=(l,v,s)=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
const pill=s=>{const c={Closed:"var(--s1)",Open:"var(--s2)",Answered:"var(--s3)","Re-issued":"var(--s4)"}[s];return `<span class="pill" style="color:${c}">${s}</span>`};
const siteSeries=()=>D.sites.map(s=>s.id);

/* ---------- pages ---------- */
const P={};
P.overview=()=>{
  const d=data(),n=d.subj.length;
  $("#view").innerHTML=`<div class="kpis">${kpi("Subjects enrolled",n,state.site==="ALL"?"across 10 sites":siteName(state.site))}${kpi("Queries logged",d.q.length,(d.q.length/Math.max(1,n)*100).toFixed(0)+" per 100 subjects")}${kpi("Closure rate",pct(d.closed/Math.max(1,d.q.length)),d.closed+" closed")}${kpi("SLA met",pct(d.met/Math.max(1,d.answered.length)),"of "+d.answered.length+" answered")}${kpi("Open backlog",d.backlog.length,"not yet closed")}${kpi("Serious AEs",d.sae,d.ae.length+" AEs in total")}</div>
  <div class="grid">${card("c1","Queries by status","Lifecycle position of every logged query","w4")}${card("c2","Queries by edit check","Which rules generate the most discrepancies","w8")}
  ${card("c3","Enrolment by month","Informed consent date","w4")}${card("c4","Query activity per week","Issued vs answered","w8")}${card("c5","Queries by site","Click a bar to filter the report","w12")}</div>`;
  const sc=cnt(d.q,x=>x.st);donut($("#c1"),ST.map(([k,c])=>({k,c,v:sc[k]||0})),"queries");
  hbar($("#c2"),sorted(cnt(d.q,x=>x.c)).map(([k,v])=>({k:CHK[k],v,tip:k+" · "+CHK[k]+": "+v})),{wide:1,aria:"Queries by edit check"});
  const ms=["2026-01","2026-02","2026-03","2026-04"],mc=cnt(d.subj,x=>x.m);vbar($("#c3"),ms.map(m=>({k:mlab(m),vals:[mc[m]||0]})),[{n:"Subjects",c:"var(--s1)"}],{aria:"Enrolment by month"});
  weekly($("#c4"),d.q);
  const qs=cnt(D.q,x=>x.s);hbar($("#c5"),D.sites.map(s=>({k:s.id+" · "+s.name,id:s.id,v:qs[s.id]||0,tip:s.name+": "+(qs[s.id]||0)+" queries"})),{click:1,wide:1,aria:"Queries by site"});
};
function weekly(el,q){
  const wk=s=>{const x=t(s),dow=(new Date(x).getUTCDay()+6)%7;return x-dow*DAY};
  const st=wk("2026-07-06"),en=wk("2026-08-31"),ws=[];for(let x=st;x<=en;x+=7*DAY)ws.push(x);
  const I=ws.map(w=>q.filter(x=>wk(x.i)===w).length),A=ws.map(w=>q.filter(x=>x.a&&wk(x.a)===w).length);
  line(el,ws.map(w=>{const d=new Date(w);return d.getUTCDate()+" "+MON[d.getUTCMonth()]}),[{n:"Issued",c:"var(--s1)",v:I},{n:"Answered",c:"var(--s3)",v:A}],{aria:"Weekly query activity"});
  el.insertAdjacentHTML("beforeend",legend([{n:"Issued",c:"var(--s1)"},{n:"Answered",c:"var(--s3)"}]));
}
P.queries=()=>{
  const d=data();
  $("#view").innerHTML=`<div class="kpis">${kpi("Open backlog",d.backlog.length,"Open, Answered or Re-issued")}${kpi("Oldest query",Math.max(0,...d.backlog.map(d.age)),"days since issue")}${kpi("Avg turnaround",(d.answered.reduce((a,b)=>a+b.tat,0)/Math.max(1,d.answered.length)).toFixed(1),"business days")}${kpi("SLA met",pct(d.met/Math.max(1,d.answered.length)),"standard 5 days · SAE 1 day")}</div>
  <div class="grid">${card("q1","Status by site","Stacked by lifecycle status","w8")}${card("q2","Backlog ageing","Days since the query was issued","w4")}
  ${card("q3","Turnaround time","Business days from issue to site response","w6")}${card("q4","Longest-waiting queries","Top 10 not yet closed","w6")}</div>`;
  const ids=state.site==="ALL"?siteSeries():[state.site],keys=ST.map(([n,c])=>({n,c}));
  vbar($("#q1"),ids.map(id=>({k:id,id,vals:ST.map(([n])=>d.q.filter(x=>x.s===id&&x.st===n).length)})),keys,{click:1,aria:"Status by site"});
  $("#q1").insertAdjacentHTML("beforeend",legend(keys));
  const b=[["0–7",0,7],["8–14",8,14],["15–30",15,30],["31+",31,999]];
  hbar($("#q2"),b.map(([k,lo,hi])=>({k:k+" days",v:d.backlog.filter(x=>d.age(x)>=lo&&d.age(x)<=hi).length,c:"var(--s2)"})),{lab:84,aria:"Ageing"});
  const tb=[0,1,2,3,4,5,6];vbar($("#q3"),tb.map(k=>({k:k===6?"6+":""+k,vals:[d.answered.filter(x=>k===6?x.tat>=6:x.tat===k).length]})),[{n:"Queries",c:"var(--s1)"}],{aria:"Turnaround"});
  const rows=d.backlog.slice().sort((a,b)=>d.age(b)-d.age(a)).slice(0,10);
  $("#q4").innerHTML=`<div class="tbl"><table><thead><tr><th>Query</th><th>Site</th><th>Check</th><th>Status</th><th class="n">Days</th></tr></thead><tbody>${rows.map(x=>`<tr><td class="id">${x.id}</td><td>${x.s}</td><td title="${CHK[x.c]}">${x.c}</td><td>${pill(x.st)}</td><td class="n">${d.age(x)}</td></tr>`).join("")||"<tr><td colspan=5>No open queries for this selection.</td></tr>"}</tbody></table></div>`;
};
P.safety=()=>{
  const d=data(),ae=d.ae,n=ae.length;
  const sev=cnt(ae,x=>x.sev),subj=Math.max(1,d.subj.length);
  $("#view").innerHTML=`<div class="kpis">${kpi("Adverse events",n,(n/subj).toFixed(2)+" per subject")}${kpi("Serious AEs",d.sae,pct(d.sae/Math.max(1,n))+" of events")}${kpi("Severe events",sev.Severe||0,pct((sev.Severe||0)/Math.max(1,n)))}${kpi("Probably / definitely related",ae.filter(x=>x.rel==="Probable"||x.rel==="Definite").length,"investigator causality")}</div>
  <div class="grid">${card("a1","Top 10 reported terms","MedDRA preferred term","w8")}${card("a2","Severity","Mild, moderate or severe","w4")}${card("a3","Events per month","By AE start date","w6")}${card("a4","Serious AEs by site","Click a bar to filter","w6")}</div>`;
  hbar($("#a1"),sorted(cnt(ae,x=>x.t)).slice(0,10).map(([k,v])=>({k,v})),{wide:1,aria:"Top AE terms"});
  donut($("#a2"),[["Mild","var(--s1)"],["Moderate","var(--s4)"],["Severe","var(--s2)"]].map(([k,c])=>({k,c,v:sev[k]||0})),"events");
  const ms=["2026-01","2026-02","2026-03","2026-04","2026-05","2026-06","2026-07","2026-08"],mc=cnt(ae,x=>x.m);
  vbar($("#a3"),ms.map(m=>({k:mlab(m),vals:[mc[m]||0]})),[{n:"AEs",c:"var(--s1)"}],{aria:"Events per month"});
  const ss=cnt(D.ae.filter(x=>x.ser==="Yes"),x=>x.s);
  hbar($("#a4"),D.sites.map(s=>({k:s.id,id:s.id,v:ss[s.id]||0,tip:s.name+": "+(ss[s.id]||0)+" serious AEs",c:"var(--s2)"})),{click:1,lab:44,aria:"Serious AEs by site"});
};
P.quality=()=>{
  $("#view").innerHTML=`<div class="grid">${card("d1","Site scorecard","Discrepancy load and responsiveness; bar shows queries per 100 subjects","w12")}${card("d2","Discrepancy heatmap","Queries by edit check and site; darker is more","w12")}</div>`;
  const rows=D.sites.map(s=>{const q=D.q.filter(x=>x.s===s.id),n=D.subj.filter(x=>x.s===s.id).length,an=q.filter(x=>x.tat!=null),met=an.filter(x=>x.tat<=x.sla).length;
    return {s,n,tot:q.length,rate:q.length/Math.max(1,n)*100,open:q.filter(x=>x.st!=="Closed").length,close:q.filter(x=>x.st==="Closed").length/Math.max(1,q.length),sla:met/Math.max(1,an.length)}});
  const mr=Math.max(...rows.map(r=>r.rate));
  $("#d1").innerHTML=`<div class="tbl"><table><thead><tr><th>Site</th><th class="n">Subjects</th><th class="n">Queries</th><th>Queries / 100 subjects</th><th class="n">Backlog</th><th class="n">Closed</th><th class="n">SLA met</th></tr></thead><tbody>${rows.map(r=>`<tr${state.site===r.s.id?' style="background:var(--soft)"':""}><td><b class="id">${r.s.id}</b> ${esc(r.s.name)}</td><td class="n">${r.n}</td><td class="n">${r.tot}</td><td><div class="bt"><span>${r.rate.toFixed(0)}</span><div style="width:${r.rate/mr*100}%"></div></div></td><td class="n">${r.open}</td><td class="n">${pct(r.close)}</td><td class="n" style="color:${r.sla<.85?"var(--bad)":"var(--good)"}">${pct(r.sla)}</td></tr>`).join("")}</tbody></table></div>`;
  const ck=Object.keys(CHK),m={};D.q.forEach(x=>{m[x.c+x.s]=(m[x.c+x.s]||0)+1});const mx=Math.max(...Object.values(m));
  $("#d2").innerHTML=`<div class="tbl"><table class="heat"><thead><tr><th></th>${D.sites.map(s=>`<th>${s.id}</th>`).join("")}</tr></thead><tbody>${ck.map(c=>`<tr><td class="rowh">${CHK[c]}</td>${D.sites.map(s=>{const v=m[c+s.id]||0;return `<td data-tip="${c} · ${s.id}: ${v} queries" style="background:color-mix(in srgb,var(--s1) ${v?Math.round(12+v/mx*70):0}%,var(--surface))">${v||""}</td>`}).join("")}</tr>`).join("")}</tbody></table></div>`;
};

/* ---------- shell ---------- */
function render(){
  const [a,b]=PAGES[state.page];$("#ttl").textContent=a+(state.site==="ALL"?"":" · "+state.site);$("#sub").textContent=b;
  document.querySelectorAll(".tab").forEach(x=>x.toggleAttribute("aria-current",x.dataset.p===state.page)||x.removeAttribute("aria-current"));
  document.querySelectorAll(".tab").forEach(x=>{if(x.dataset.p===state.page)x.setAttribute("aria-current","page")});
  P[state.page]();
}
function route(){const h=location.hash.slice(1);state.page=PAGES[h]?h:"overview";render()}
$("#site").innerHTML='<option value="ALL">All sites</option>'+D.sites.map(s=>`<option value="${s.id}">${s.id} · ${esc(s.name)}</option>`).join("");
$("#site").onchange=e=>{state.site=e.target.value;render()};
$("#reset").onclick=()=>{state.site="ALL";$("#site").value="ALL";render()};
$("#theme").onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{location.hash=b.dataset.p});
document.addEventListener("click",e=>{const g=e.target.closest("[data-k]");if(g){state.site=state.site===g.dataset.k?"ALL":g.dataset.k;$("#site").value=state.site;render()}});
const tip=$("#tip");
document.addEventListener("pointermove",e=>{const g=e.target.closest("[data-tip]");if(!g){tip.hidden=true;return}
  tip.innerHTML=g.getAttribute("data-tip");tip.hidden=false;const r=tip.getBoundingClientRect();
  tip.style.left=Math.min(innerWidth-r.width-8,e.clientX+14)+"px";tip.style.top=Math.max(8,e.clientY-r.height-12)+"px"});
document.addEventListener("pointerleave",()=>tip.hidden=true);
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(render,120)});
addEventListener("hashchange",route);route();
</script>
